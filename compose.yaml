name: dealeros

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dealeros
      POSTGRES_USER: dealeros
      POSTGRES_PASSWORD: dealeros
    ports:
      - "5432:5432"
    volumes:
      - dealeros-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealeros -d dealeros"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DealerOS: Host=postgres;Port=5432;Database=dealeros;Username=dealeros;Password=dealeros
      Database__ApplyMigrations: "true"
      Database__SeedDemo: "true"
      Jwt__Key: local-compose-only-change-before-deployment-DealerOS-2026
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4173:80"
    depends_on:
      - api

volumes:
  dealeros-postgres:
