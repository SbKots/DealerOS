name: CI

on:
  push:
    branches: [master, main, "codex/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DealerOS.slnx
      - run: dotnet list DealerOS.slnx package --vulnerable --include-transitive
      - run: dotnet format DealerOS.slnx --verify-no-changes --no-restore
      - run: dotnet build DealerOS.slnx -c Release --no-restore
      - run: dotnet test DealerOS.slnx -c Release --no-build --logger trx --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/**/*.trx

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=./test-results/frontend-junit.xml
      - run: npm run build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: apps/web/test-results/*.xml
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/web/dist
      - run: npm run build:pages
      - uses: actions/upload-artifact@v4
        with:
          name: pages-demo-build
          path: apps/web/dist

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose up --build -d
      - run: |
          for i in {1..40}; do curl -fsS http://localhost:4173/health && exit 0; sleep 3; done
          docker compose logs
          exit 1
      - run: npm run test:e2e
        working-directory: apps/web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
